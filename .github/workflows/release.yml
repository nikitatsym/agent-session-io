name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Check
        run: python3 dev.py check
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  install-smoke:
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      SESSIONIO_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and run on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          SESSIONIO_INSTALL_DIR: ${{ runner.temp }}/sessionio-bin
          SESSIONIO_COMPLETION_SHELL: bash
          HOME: ${{ runner.temp }}/sessionio-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/sessionio-config
        run: |
          ./scripts/install.sh
          "$SESSIONIO_INSTALL_DIR/sessionio" version --json
          "$SESSIONIO_INSTALL_DIR/sessionio" update
          test -f "$XDG_CONFIG_HOME/sessionio/completions/bash/sessionio.bash"
          grep -F "# >>> sessionio completion >>>" "$HOME/.bashrc"
      - name: Install and run on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SESSIONIO_INSTALL_DIR: ${{ runner.temp }}/sessionio-bin
          SESSIONIO_POWERSHELL_PROFILE: ${{ runner.temp }}/sessionio-profile.ps1
          APPDATA: ${{ runner.temp }}/sessionio-config
        run: |
          ./scripts/install.ps1
          & (Join-Path $env:SESSIONIO_INSTALL_DIR "sessionio.exe") version --json
          & (Join-Path $env:SESSIONIO_INSTALL_DIR "sessionio.exe") update
          if (-not (Test-Path $env:SESSIONIO_POWERSHELL_PROFILE -PathType Leaf)) {
            throw "PowerShell completion profile was not created"
          }
          if (-not (Select-String -Quiet -SimpleMatch "# >>> sessionio completion >>>" $env:SESSIONIO_POWERSHELL_PROFILE)) {
            throw "PowerShell completion profile is not connected"
          }
